# Render Blueprint for the Dapper Den BACKEND (FastAPI).
# The frontend is deployed separately on Netlify (see DEPLOYMENT.md).
# Deploy: Render Dashboard → New + → Blueprint → connect this repo,
# then fill in the MONGO_URL secret.

services:
  - type: web
    name: dapperden-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION     # avoids Render defaulting to a too-new Python
        value: "3.11.15"
      - key: MONGO_URL          # paste your MongoDB Atlas connection string
        sync: false
      - key: DB_NAME
        value: dapperden
      - key: CORS_ORIGINS       # "*" is fine (guest-only, no cookies)
        value: "*"
      - key: RESEND_API_KEY     # leave blank to keep emails mocked; paste re_... to send for real
        sync: false
      - key: SENDER_EMAIL
        value: onboarding@resend.dev
      - key: SITE_URL           # links in emails point here
        value: https://dapper-denn.netlify.app
      - key: SUPPORT_EMAIL      # optional reply-to shown in emails
        sync: false
      - key: ORDER_NOTIFY_EMAIL # optional: get an email for every new order
        sync: false
      - key: ADMIN_TOKEN        # optional: unlocks /api/admin/* (leave blank to disable)
        sync: false
